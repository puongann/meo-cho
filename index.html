<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Một ngày của Chó</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: sticker-style kawaii UI on a pink grid (like the reference cat picture); projector stage is a 16:9 SVG. */
:root{
  --paper:#fffaf6; --grid:#f7e1e2; --ink:#4a3428; --ink-soft:#7d6558;
  --card:#ffffff; --pink:#f6aaa4; --pink-deep:#e2726a; --taiyaki:#f4b04a; --taiyaki-deep:#d68a1e;
  --mint:#6fbf8e; --ghost:#5b4b8a; --line:#ead8cd; --sky:#9fd6ff;
  --display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:46px 46px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
button{font-family:inherit}
.btn{font:800 18px/1.1 var(--display);padding:13px 22px 11px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--taiyaki)}
.btn.pink{background:var(--pink)}
.btn.ghosty{background:transparent;box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:22px;padding:16px 28px 14px;width:100%}
.linkbtn{background:none;border:0;color:var(--ink-soft);font-weight:800;text-decoration:underline;cursor:pointer;padding:6px}
:focus-visible{outline:4px solid #6db8f2;outline-offset:3px}
input,textarea{font:700 18px var(--body);color:var(--ink);width:100%;padding:12px 16px;border:3px solid var(--ink);border-radius:16px;background:#fffdfb}
textarea{resize:vertical;min-height:96px;line-height:1.4}
input::placeholder,textarea::placeholder{color:#b8a59a;font-weight:600}
label{font-weight:800;display:grid;gap:6px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:24px;box-shadow:0 7px 0 rgba(74,52,40,.18)}
.eyebrow{font:800 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--pink-deep)}
.note{font-size:14px;color:var(--ink-soft)}
.err{background:#ffe3e0;border:2px solid var(--pink-deep);border-radius:14px;padding:10px 14px;font-weight:700;color:#9b2d25}
.actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
pre{background:#fff6ef;border:2px dashed var(--line);border-radius:14px;padding:12px 14px;overflow-x:auto;margin:0}

/* ---------- Home ---------- */
.page{max-width:920px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero-cat{width:150px;flex:none}
.hero-cat svg{width:100%;height:auto;display:block}
.hero h1{font-size:clamp(40px,7vw,68px);font-weight:800}
.hero h1 span{color:var(--pink-deep)}
.hero .lead{max-width:56ch;margin-top:8px;font-size:18px}
.hero>div:last-child{flex:1;min-width:240px}
.form{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
details.card summary{font:800 20px var(--display);cursor:pointer}
details.card[open] summary{margin-bottom:12px}
details ol{padding-left:22px;margin:0 0 12px;display:grid;gap:6px}
.copyrow{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.copyrow pre{flex:1;min-width:0}

/* ---------- Lobby ---------- */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px;align-items:start}
@media (max-width:760px){.lobby{grid-template-columns:1fr}}
.code-big{font:800 clamp(64px,10vw,110px)/1 var(--display);letter-spacing:.08em;color:var(--ink)}
.qr{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;width:max-content;max-width:100%}
.qr img,.qr canvas{display:block;width:220px;height:220px;max-width:100%}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbox code{background:#fff6ef;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;word-break:break-all;flex:1;min-width:0}
.subs-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font:800 56px/1 var(--display);color:var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;min-height:60px}
.chip{background:#eaf7ef;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;animation:chipIn .35s ease-out both}
.empty{color:var(--ink-soft);font-weight:700}
@keyframes chipIn{from{transform:scale(.6);opacity:0}}
.lobby-cat{width:110px}

/* ---------- Student ---------- */
.student{max-width:520px}
.st-head{display:flex;gap:14px;align-items:center}
.st-head svg{width:84px;height:auto;flex:none}
.st-head h1{font-size:32px}
.tip{background:#fff6e6;border:2px dashed var(--taiyaki);border-radius:16px;padding:12px 14px;font-size:15px}
.tip b{font-family:var(--display)}
.done{text-align:center;display:grid;gap:14px;justify-items:center}
.done .big-check{width:84px;height:84px;border-radius:50%;background:var(--mint);border:3px solid var(--ink);display:grid;place-items:center;font:800 48px/1 var(--display);color:#fff}
.mysentence{background:#fff6ef;border:2px dashed var(--line);border-radius:16px;padding:12px 16px;font-weight:800;font-size:19px;width:100%}

/* ---------- Reveal ---------- */
.reveal{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px))}
.rv-top{display:flex;align-items:center;gap:14px;justify-content:space-between}
.rv-title{font:800 clamp(18px,2vw,28px)/1.1 var(--display)}
.rv-title b{color:var(--pink-deep)}
.rv-title span{color:var(--ink-soft);font-weight:700}
.rv-progress{font:800 18px var(--display);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.rv-tools{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:800 18px/1 var(--display);cursor:pointer;color:var(--ink);display:grid;place-items:center}
.stage-wrap{min-height:0;display:grid;place-items:center}
.stage{position:relative;border:4px solid var(--ink);border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 8px 0 rgba(74,52,40,.2);--u:10px}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#fxSvg{pointer-events:none}
.clock{position:absolute;top:3%;right:2.2%;display:flex;align-items:center;gap:.45em;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:.22em .8em .22em .25em;font:800 calc(var(--u)*2.1)/1 var(--display);font-variant-numeric:tabular-nums;z-index:2}
.clock svg{width:1.7em;height:1.7em;display:block}
.rv-bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.caption{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:10px 18px;min-height:76px}
.cap-time{font:800 clamp(18px,2vw,30px)/1 var(--display);background:var(--taiyaki);border:3px solid var(--ink);border-radius:14px;padding:8px 12px 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap-body{min-width:0}
.cap-sentence{font:700 clamp(18px,2.3vw,38px)/1.2 var(--display)}
.cap-author{color:var(--ink-soft);font-weight:800;font-size:clamp(13px,1.2vw,18px)}
mark.bad{background:none;color:#c62f24;text-decoration:underline wavy #c62f24;text-underline-offset:6px}
.fixed-badge{display:inline-block;font:800 .55em/1 var(--body);background:var(--mint);color:#fff;border-radius:999px;padding:.35em .7em;vertical-align:middle}
.nav{font-size:clamp(18px,1.8vw,26px);padding:16px 26px 14px}
#nextBtn{min-width:150px}

/* fix card over the stage */
.fixcard{position:absolute;right:2.5%;bottom:4%;width:min(94%,calc(var(--u)*44));background:#fff;border:3px solid var(--ink);border-radius:24px;padding:1em 1.2em;box-shadow:0 8px 0 rgba(30,20,60,.35);font-size:clamp(14px,calc(var(--u)*1.35),22px);display:grid;gap:.55em;z-index:3;animation:cardIn .45s cubic-bezier(.3,1.5,.6,1) both}
.fixcard h3{font-size:1.5em;color:var(--ghost)}
.fixcard .fix-msg{font-weight:800}
.fixcard input{font-size:1.05em;padding:.5em .7em}
.fixcard .fix-hint{background:#f1edff;border:2px dashed var(--ghost);border-radius:12px;padding:.45em .7em;font-weight:700}
.fixcard .btn{font-size:1em;padding:.6em 1.1em .5em}
.fixcard .fix-actions{display:flex;gap:.6em;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.fixcard .fix-actions .linkbtn{margin-right:auto;font-size:.85em}
.fixcard.shake{animation:cardShake .4s}
.fixcard.win{border-color:var(--mint)}
.fixcard.win h3{color:#2f8a55}
@keyframes cardIn{from{transform:translateY(40px);opacity:0}}
@keyframes cardShake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(74,52,40,.45);display:grid;place-items:center;padding:16px;z-index:10;animation:fadeIn .3s both}
.modal{background:#fff;border:4px solid var(--ink);border-radius:30px;padding:28px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 0 rgba(74,52,40,.3);display:grid;gap:18px;animation:cardPop .5s cubic-bezier(.3,1.5,.6,1) both}
.modal.intro{text-align:center;justify-items:center}
.modal.intro svg{width:170px;height:auto}
.modal.intro h2{font-size:clamp(26px,3.4vw,44px)}
.modal.intro p{font-size:clamp(18px,2vw,26px);font-weight:700;max-width:34ch}
.modal h2 b{color:var(--pink-deep)}
@keyframes fadeIn{from{opacity:0}}
@keyframes cardPop{from{transform:scale(.7);opacity:0}}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;border-bottom:2px dashed var(--line);padding-bottom:8px}
.tl-time{font:800 16px var(--display);background:var(--taiyaki);border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-text{font-weight:800}
.tl-text em{color:var(--mint);font-style:normal;font-size:.85em}
.tl-name{color:var(--ink-soft);font-weight:700;font-size:14px}

/* ---------- SVG scene animation ---------- */
svg text{font-family:var(--display);font-weight:800}
:where(svg g[class]){transform-box:fill-box;transform-origin:50% 100%}
.a-bob{animation:bob 1.6s ease-in-out infinite}
.a-waddle{animation:waddle .5s ease-in-out infinite}
.a-walkin{animation:walkIn 1.4s ease-out both}
.a-wakeup{animation:wakeup 3.2s ease-in-out forwards}
.e-first{animation:hideAt 3.2s forwards}
.e-second{animation:showAt 3.2s forwards}
.a-zfade{animation:zfade 3.2s forwards}
.a-ring{animation:ring .45s linear infinite}
.a-blink{animation:blink .6s steps(2) infinite}
.a-brush{animation:brush .22s ease-in-out infinite alternate}
.a-rise{animation:rise 1.8s ease-out infinite}
.a-drip{animation:drip 1s linear infinite}
.a-chew{animation:chew .35s ease-in-out infinite;transform-origin:50% 50%}
.a-sway{animation:sway 1.2s ease-in-out infinite}
.a-flicker{animation:flicker .3s ease-in-out infinite alternate}
.a-appear{animation:appear .6s ease-out both;transform-origin:50% 100%}
.a-float{animation:float 2.4s ease-in-out infinite}
.a-typing{animation:bob .3s ease-in-out infinite}
.a-shake{animation:shake .25s linear infinite}
.a-run{animation:run .45s ease-in-out infinite}
.a-kick{animation:kick 1.6s cubic-bezier(.3,.6,.4,1) .4s both}
.a-spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
.a-pop{animation:pop .5s ease-out both;transform-origin:50% 50%}
.a-zzz{animation:zzz 3s ease-out infinite}
.a-pulse{animation:pulse .7s ease-in-out infinite;transform-origin:50% 50%}
.a-heart{animation:heartUp 2.6s ease-out infinite}
.a-scrollup{animation:scrollUp 10s linear infinite}
.a-ticker{animation:ticker 8s linear infinite}
.a-dance{animation:dance .9s ease-in-out infinite}
.a-drift{animation:drift 70s linear infinite}
.a-scrollx{animation:scrollX 7s linear infinite}
.a-drive{animation:drive .4s ease-in-out infinite}
.a-fly{animation:flyAcross 7s linear infinite}
.a-flap{animation:flap .25s ease-in-out infinite alternate;transform-origin:100% 100%}
.a-peek{animation:peek 1s ease-out both}
.a-beam{animation:beam 2.4s ease-in infinite}
.a-wave{animation:wave .5s ease-in-out infinite alternate;transform-origin:10% 100%}
.a-swim{animation:swim 5s linear infinite}
.a-twinkle{animation:blink 1.6s ease-in-out infinite}
.a-puff{animation:puff 1.4s ease-out infinite;transform-origin:50% 50%}
.a-beams{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 0%}
.gin{animation:ghostIn .7s cubic-bezier(.3,1.6,.6,1) both;transform-origin:50% 50%}
.gfl{animation:ghostFloat 2.4s ease-in-out infinite;transform-origin:50% 50%}
.eyes-shock{opacity:0}
.haunted .eyes-shock{opacity:1}
.haunted .eyes-main{opacity:0}
.haunted .shaker{animation:shake .16s linear infinite}
#sceneSvg{transition:filter .8s}
.haunted #sceneSvg{filter:brightness(.55) saturate(.55) hue-rotate(215deg)}
.leaving .gin{animation:ghostOut .9s ease-in forwards!important}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes waddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-8px)}}
@keyframes walkIn{from{transform:translateX(-700px)}to{transform:translateX(0)}}
@keyframes wakeup{0%,30%{transform:translate(0,0)}50%{transform:translate(200px,-130px)}75%{transform:translate(480px,205px)}86%{transform:translate(525px,185px)}100%{transform:translate(570px,205px)}}
@keyframes hideAt{0%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes showAt{0%,30%{opacity:0}34%,100%{opacity:1}}
@keyframes zfade{0%,25%{opacity:1}35%,100%{opacity:0}}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes blink{50%{opacity:.15}}
@keyframes brush{from{transform:translate(-7px,4px)}to{transform:translate(7px,-4px)}}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-150px) scale(1.15);opacity:0}}
@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(380px);opacity:0}}
@keyframes chew{50%{transform:scaleY(.35)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes flicker{from{transform:scale(1,1);opacity:1}to{transform:scale(1.06,1.16);opacity:.85}}
@keyframes appear{from{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}to{transform:scale(1);opacity:1}}
@keyframes float{50%{transform:translateY(-20px)}}
@keyframes shake{25%{transform:translate(-6px,2px)}75%{transform:translate(6px,-2px)}}
@keyframes run{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-26px) rotate(4deg)}}
@keyframes kick{0%{transform:translate(0,0)}55%{transform:translate(420px,-300px)}100%{transform:translate(720px,-150px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.2)}to{transform:scale(1)}}
@keyframes zzz{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(70px,-170px) scale(1.3);opacity:0}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes heartUp{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(-30px,-320px) scale(1.2);opacity:0}}
@keyframes scrollUp{to{transform:translateY(-50%)}}
@keyframes ticker{to{transform:translateX(-50%)}}
@keyframes dance{0%,100%{transform:rotate(-10deg)}25%{transform:rotate(0) translateY(-18px)}50%{transform:rotate(10deg)}75%{transform:rotate(0) translateY(-18px)}}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
@keyframes scrollX{to{transform:translateX(-1600px)}}
@keyframes drive{50%{transform:translateY(-5px)}}
@keyframes flyAcross{from{transform:translateX(-200px)}to{transform:translateX(1900px)}}
@keyframes flap{from{transform:rotate(0)}to{transform:rotate(-35deg)}}
@keyframes peek{from{transform:translateY(240px)}to{transform:translateY(0)}}
@keyframes beam{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-230px) scale(.4);opacity:0}}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(22deg)}}
@keyframes swim{from{transform:translateX(-90px)}to{transform:translateX(450px)}}
@keyframes puff{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6) translateY(-40px);opacity:0}}
@keyframes ghostIn{from{transform:scale(0) translateY(80px);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ghostFloat{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(16px,-26px) rotate(6deg)}}
@keyframes ghostOut{to{transform:translateY(-800px) scale(.3);opacity:0}}
@media (max-width:700px){
  .rv-bottom{grid-template-columns:1fr 1fr}
  .caption{grid-column:1/-1;order:-1}
  .rv-title span{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= CONFIG =================
   Không bắt buộc: dán Firebase Database URL vào đây nếu muốn học viên
   tự gõ mã phòng mà không cần quét QR. */
const CONFIG = { DB_URL: '' };

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const app = document.getElementById('app');
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================= backend (Firebase REST or local test) ================= */
function normDb(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (u === 'local') return 'local';
  try { const x = new URL(u); return x.origin; } catch (e) { return ''; }
}
function makeBackend(db) {
  if (db === 'local') {
    const key = c => 'localroom_' + c;
    return {
      local: true,
      async getRoom(c) { return LS.get(key(c), null); },
      async setRoom(c, d) { LS.set(key(c), d); },
      async patchRoom(c, p) { const r = LS.get(key(c), null) || {}; Object.assign(r, p); LS.set(key(c), r); },
      async putEntry(c, id, e) { const r = LS.get(key(c), null); if (!r) throw new Error('notfound'); r.entries = r.entries || {}; r.entries[id] = e; LS.set(key(c), r); },
      async patchEntry(c, id, p) { const r = LS.get(key(c), null); if (!r || !r.entries || !r.entries[id]) return; Object.assign(r.entries[id], p); LS.set(key(c), r); },
      async ping() { return true; }
    };
  }
  const req = async (path, method = 'GET', body) => {
    const res = await fetch(`${db}/${path}.json`, { method, body: body === undefined ? undefined : JSON.stringify(body) });
    if (res.status === 401 || res.status === 403) throw new Error('denied');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  };
  return {
    local: false,
    getRoom: c => req(`rooms/${c}`),
    setRoom: (c, d) => req(`rooms/${c}`, 'PUT', d),
    patchRoom: (c, p) => req(`rooms/${c}`, 'PATCH', p),
    putEntry: (c, id, e) => req(`rooms/${c}/entries/${id}`, 'PUT', e),
    patchEntry: (c, id, p) => req(`rooms/${c}/entries/${id}`, 'PATCH', p),
    ping: () => req('rooms/__ping')
  };
}

/* ================= sound (WebAudio, nothing downloaded) ================= */
const Sound = {
  ctx: null, master: null, muted: LS.get('muted', false), loops: [],
  init() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : .55; this.master.connect(this.ctx.destination); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  ok() { return !!this.ctx; },
  setMuted(m) { this.muted = m; LS.set('muted', m); if (this.master) this.master.gain.value = m ? 0 : .55; },
  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  tone(f, t, d, type = 'sine', v = .2, f2 = null) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    this.env(g, t, .008, v, d); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .05);
  },
  noiseBuf() { if (this._nb) return this._nb; const c = this.ctx, b = c.createBuffer(1, c.sampleRate * .5, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return (this._nb = b); },
  noise(t, d, v, freq = 6000, type = 'highpass') {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noiseBuf();
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; const g = c.createGain();
    this.env(g, t, .002, v, d); s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + d + .05);
  },
  pop() { if (!this.ok()) return; this.tone(480, this.ctx.currentTime, .1, 'sine', .25, 900); },
  chime() { if (!this.ok()) return; const t = this.ctx.currentTime; [1046.5, 1318.5, 1568, 2093].forEach((f, i) => this.tone(f, t + i * .09, .4, 'triangle', .18)); },
  buzz() { if (!this.ok()) return; const t = this.ctx.currentTime; this.tone(200, t, .3, 'sawtooth', .1, 110); },
  sting() { if (!this.ok()) return; const t = this.ctx.currentTime; [523, 494, 466, 440].forEach((f, i) => this.tone(f, t + i * .14, .3, 'sawtooth', .08)); },
  alarm() { if (!this.ok()) return; const t = this.ctx.currentTime; for (let i = 0; i < 8; i++) this.tone(1320, t + i * .16, .09, 'square', .05); },
  beat() {
    if (!this.ok()) return;
    const c = this.ctx, step = 60 / 124 / 2; let next = c.currentTime + .06, i = 0;
    const N = { A4: 440, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880 };
    const mel = ['E5', 0, 'E5', 'G5', 0, 'E5', 'D5', 'C5', 0, 'A4', 'C5', 0, 'D5', 0, 'E5', 0, 'G5', 0, 'E5', 'D5', 0, 'C5', 'D5', 0, 'E5', 0, 'D5', 'C5', 'A4', 0, 0, 0];
    const roots = [110, 87.31, 130.81, 98];
    const id = setInterval(() => {
      while (next < c.currentTime + .25) {
        const s = i % 32, bar = Math.floor(i / 8) % 4;
        if (s % 4 === 0) this.tone(150, next, .18, 'sine', .9, 40);
        if (s % 8 === 4) this.noise(next, .16, .35, 1800, 'bandpass');
        this.noise(next, .03, s % 2 ? .12 : .05, 7500);
        this.tone(roots[bar] * (s % 2 ? 2 : 1), next, step * .9, 'triangle', .22);
        const n = mel[s]; if (n) { this.tone(N[n], next, step * .85, 'square', .055); this.tone(N[n] * 2, next, step * .5, 'sine', .035); }
        next += step; i++;
      }
    }, 40);
    this.loops.push(() => clearInterval(id));
  },
  spooky() {
    if (!this.ok()) return;
    const c = this.ctx, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 320; lfo.frequency.value = 5.5; lg.gain.value = 24;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.09, c.currentTime + .5);
    o.connect(g); g.connect(this.master); o.start(); lfo.start();
    const id = setInterval(() => { o.frequency.exponentialRampToValueAtTime(rand(220, 520), c.currentTime + .8); }, 900);
    this.loops.push(() => { clearInterval(id); const t = c.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, .0002), t); g.gain.exponentialRampToValueAtTime(.0001, t + .35); o.stop(t + .4); lfo.stop(t + .4); });
  },
  stopLoops() { this.loops.splice(0).forEach(f => { try { f(); } catch (e) {} }); }

  layer.innerHTML = `<div class="fixcard" role="dialog" aria-labelledby="fixT">
    <h3 id="fixT">Ối! Sinh vật lạ xuất hiện!</h3>
    <p class="fix-msg" id="fixMsg">${m.msg}</p>
    <label for="fixInput">Cả lớp cùng sửa lại câu này:</label>
    <input id="fixInput" autocomplete="off" spellcheck="false" value="${esc(text)}">
    <p class="fix-hint" id="fixHint" hidden></p>
    <div class="fix-actions">
      <button class="linkbtn" id="skipBtn" type="button">Bỏ qua</button>
      <button class="btn" id="hintBtn" type="button">Gợi ý</button>
      <button class="btn primary" id="checkBtn" type="button">Kiểm tra</button>
    </div>
  </div>`;
  let cur = m, hintStep = 0;
  const card = layer.querySelector('.fixcard'), input = $('#fixInput');
  setTimeout(() => { input.focus(); const p = g.wrong ? g.wrong.i + g.wrong.raw.length : input.value.length; try { input.setSelectionRange(p, p); } catch (e) {} }, 400);
  const shake = () => { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); };
  $('#hintBtn').onclick = () => {
    const h = $('#fixHint'); hintStep++;
    h.innerHTML = hintStep === 1 ? cur.hint : `${cur.hint}<br>Đáp án: <b>${esc(cur.ans)}</b>`;
    h.hidden = false;
    if (hintStep >= 2) $('#hintBtn').disabled = true;
  };
  $('#skipBtn').onclick = () => { it.ok = true; banish(); };
  const check = () => {
    const val = input.value.trim();
    if (!val) { shake(); return; }
    const g2 = checkGrammar(val);
    if (g2.error) {
      Sound.buzz(); shake();
      cur = errText(g2, R.meta.cat); hintStep = 0; $('#hintBtn').disabled = false; $('#fixHint').hidden = true;
      $('#fixMsg').innerHTML = (val === (it.fixed || it.sentence) ? '' : 'Vẫn chưa đúng! ') + cur.msg;
      renderCaption(it, val, g2);
      return;
    }
    it.fixed = val; it.ok = true;
    const nt = parseTime(val); if (nt) it.time = nt;
    if (R.meta.code && R.meta.db) { try { makeBackend(R.meta.db).patchEntry(R.meta.code, it.id, { fixed: val }).catch(() => {}); } catch (e) {} }
    card.classList.add('win');
    card.innerHTML = `<h3>Chính xác! 🎉</h3><p class="fix-msg">Sinh vật lạ bỏ chạy hết rồi. ${esc(R.meta.cat)} được yên rồi!</p>`;
    banish(true);
  };
  $('#checkBtn').onclick = check;
  input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
}
function banish(won) {
  Sound.stopLoops(); if (won) Sound.chime();
  const st = $('#stage'); st.classList.add('leaving');
  R.timers.push(setTimeout(() => { showSlide(R.i); }, won ? 1500 : 900));
}
function endView() {
  clearTimers(); Sound.stopLoops(); unhauntNow();
  const cat = R.meta.cat;
  const c = { h: 22, mi: 0, cat };
  $('#sceneSvg').innerHTML = defs(22) + SC.sleep(c);
  $('#clockBox').hidden = true;
  const fixedN = R.items.filter(i => i.fixed && i.fixed !== i.sentence).length;
  const lines = R.items.map(it => `${it.time ? it.time.label : '??'} — ${it.fixed || it.sentence} (${it.name || 'Ẩn danh'})`).join('\n');
  $('#modal').innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-labelledby="endT">
    <h2 id="endT">Hết một ngày của <b>${esc(cat)}</b>! 🌙</h2>
    <p>Cả lớp đã viết ${R.items.length} câu${fixedN ? `, sửa đúng ${fixedN} câu sai` : ''}. Đây là cả ngày của ${esc(cat)}:</p>
    <ol class="timeline">${R.items.map(it => `<li><span class="tl-time">${it.time ? it.time.label : '??'}</span><span class="tl-text">${esc(it.fixed || it.sentence)}${it.fixed && it.fixed !== it.sentence ? ' <em>✓ đã sửa</em>' : ''}</span><span class="tl-name">${esc(it.name || 'Ẩn danh')}</span></li>`).join('')}</ol>
    <div class="actions">
      <button class="btn" id="replayBtn">Xem lại từ đầu</button>
      <button class="btn" id="copyAll">Chép cả bài</button>
      <button class="btn primary" id="doneBtn">${R.meta.demo ? 'Về trang chính' : 'Về phòng chờ'}</button>
    </div>
  </div></div>`;
  $('#replayBtn').onclick = () => { $('#modal').innerHTML = ''; showSlide(0); };
  $('#copyAll').onclick = e => copyText(lines, e.currentTarget);
  $('#doneBtn').onclick = exitReveal;
}

/* ================= STUDENT ================= */
async function studentView(code, db) {
  const head = cat => `<header class="st-head">${miniCat()}<div><p class="eyebrow">Phòng ${esc(code)}</p><h1>Một ngày của ${esc(cat)}</h1></div></header>`;
  if (!db) { app.innerHTML = `<main class="page student">${head('Chó')}<p class="err">Link thiếu thông tin kết nối. Hãy quét lại mã QR trên màn hình.</p></main>`; return; }
  const be = makeBackend(db);
  let myId = LS.get('sid_' + code, null);
  if (!myId) { myId = 's' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3); LS.set('sid_' + code, myId); }
  app.innerHTML = `<main class="page student"><p class="note">Đang vào phòng…</p></main>`;
  let room;
  try { room = await be.getRoom(code); }
  catch (e) { app.innerHTML = `<main class="page student">${head('Chó')}<p class="err">Không kết nối được. Kiểm tra mạng rồi tải lại trang.</p><button class="btn" onclick="location.reload()">Tải lại</button></main>`; return; }
  if (!room) { app.innerHTML = `<main class="page student">${head('Chó')}<p class="err">Không tìm thấy phòng ${esc(code)}. Hãy quét lại mã QR trên màn hình.</p></main>`; return; }
  const catName = room.catName || 'Chó';
  const mine = (room.entries || {})[myId];

  const lockedView = () => {
    stopPolling();
    app.innerHTML = `<main class="page student">${head(catName)}<section class="card done"><div class="big-check">👀</div><h2>Cả lớp đang xem!</h2><p>Giáo viên đã bấm Tổng hợp. Nhìn lên màn hình nhé!</p>${LS.get('mine_' + code, null) ? `<div class="mysentence">${esc(LS.get('mine_' + code).sentence)}</div>` : ''}</section></main>`;
  };
  const doneView = entry => {
    app.innerHTML = `<main class="page student">${head(catName)}<section class="card done">
      <div class="big-check">✓</div><h2>Đã gửi!</h2>
      <div class="mysentence">${esc(entry.sentence)}</div>
      <p>Nhìn lên màn hình và chờ giáo viên bấm <b>Tổng hợp</b> nhé.</p>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="editBtn">Sửa câu</button>
        <button class="btn pink" id="nextStBtn">Bạn khác gửi câu</button>
      </div>
      <p class="note">Dùng chung máy? Bấm <b>Bạn khác gửi câu</b> để bạn tiếp theo viết câu riêng. Câu của bạn trước vẫn được giữ.</p>
    </section></main>`;
    $('#editBtn').onclick = () => { stopPolling(); formView(entry); };
    $('#nextStBtn').onclick = () => {
      stopPolling();
      myId = 's' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
      LS.set('sid_' + code, myId); LS.del('mine_' + code);
      formView(null, true);
    };
    startPolling(async () => { try { const r = await be.getRoom(code); if (r && r.status === 'locked') lockedView(); } catch (e) {} }, 4000);
  };
  const formView = (prev, fresh = false) => {
    const name = fresh ? '' : ((prev && prev.name) || LS.get('stName', ''));
    app.innerHTML = `<main class="page student">${head(catName)}
      <form class="card form" id="stForm">
        <label for="stName">Tên của bạn<input id="stName" maxlength="24" autocomplete="off" value="${esc(name)}" placeholder="VD: Minh"></label>
        <label for="stText">Câu của bạn<textarea id="stText" maxlength="160" placeholder="At 6 a.m., I get up and brush my teeth.">${esc(prev ? prev.sentence : '')}</textarea></label>
        <div class="tip"><b>Cách viết:</b> At + giờ, I / He / She + làm gì.<br>VD: At 7 a.m., I go to school. · At 9 p.m., she watches TV.</div>
        <p class="err" id="stErr" hidden></p>
        <button class="btn primary big" type="submit" id="stBtn">Gửi câu</button>
      </form></main>`;
    $('#stForm').onsubmit = async e => {
      e.preventDefault();
      const err = $('#stErr'); err.hidden = true;
      const nm = $('#stName').value.trim(), tx = $('#stText').value.trim().replace(/\s+/g, ' ');
      const fail = m => { err.textContent = m; err.hidden = false; };
      if (!nm) return fail('Bạn quên ghi tên rồi.');
      if (tx.split(' ').length < 3) return fail('Viết một câu đầy đủ nhé, ví dụ: At 7 a.m., I go to school.');
      if (!parseTime(tx)) return fail('Bạn quên ghi giờ rồi! Bắt đầu câu bằng At + giờ, ví dụ: At 7 a.m., …');
      const btn = $('#stBtn'); btn.disabled = true; btn.textContent = 'Đang gửi…';
      try {
        const r = await be.getRoom(code);
        if (!r) return fail('Phòng không còn nữa.');
        if (r.status === 'locked') return lockedView();
        const entry = { name: nm, sentence: tx, ts: (prev && prev.ts) || Date.now() };
        await be.putEntry(code, myId, entry);
        LS.set('stName', nm); LS.set('mine_' + code, entry);
        doneView(entry);
      } catch (ex) { fail('Gửi chưa được. Kiểm tra mạng rồi thử lại.'); btn.disabled = false; btn.textContent = 'Gửi câu'; }
    };
  };
  if (room.status === 'locked') lockedView();
  else if (mine) doneView(mine);
  else formView(null);
}

/* ================= boot ================= */
(function boot() {
  const qs = new URLSearchParams(location.search);
  const room = qs.get('room');
  if (room) studentView(room.toUpperCase().slice(0, 8), normDb(qs.get('db') || CONFIG.DB_URL || ''));
  else teacherHome();
})();
</script>
